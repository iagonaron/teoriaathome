<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Indica la tonalidad · cargando</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ec4899'/%3E%3Cpath d='M24 18v28l22-14z' fill='white'/%3E%3C/svg%3E">
<style>
  :root{
    --rosa:#ec4899; --texto:#e8eef5; --suave:#94a3b8; --oro:#d4af37;
    --panel:rgba(11,19,32,.88); --borde:rgba(255,255,255,.16);
    --fuente:"Helvetica Neue",Helvetica,"TeX Gyre Heros",Arial,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#050b14;color:var(--texto);font-family:var(--fuente);overflow:hidden;-webkit-font-smoothing:antialiased}
  #marco{position:fixed;inset:0;background:#050b14}
  #escenario{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;background:#081628}
  #lienzo{position:absolute;inset:0;width:1920px;height:1080px;display:block}
  /* portada: el mismo título del principio + botón de empezar */
  #portada{position:absolute;left:0;right:0;top:720px;display:flex;justify-content:center;z-index:5;transition:opacity .6s}
  #portada.fuera{opacity:0;pointer-events:none}
  #botonPlay{width:112px;height:112px;border-radius:22px;border:0;background:var(--rosa);color:#fff;cursor:pointer;display:grid;place-items:center;opacity:.55;transition:opacity .3s, transform .2s}
  #botonPlay.listo{opacity:1}
  #botonPlay:hover{transform:scale(1.04)}
  #botonPlay svg{width:46px;height:46px;margin-left:6px}
  /* final (norma 3): dos opciones bajo el título */
  #finalUI{position:absolute;left:0;right:0;top:716px;display:none;justify-content:center;gap:28px;z-index:4}
  #finalUI.on{display:flex}
  .boton{font:700 30px/1 var(--fuente);letter-spacing:.04em;text-decoration:none;border-radius:14px;padding:26px 46px;min-width:300px;text-align:center;transition:transform .2s, background .2s, border-color .2s}
  .boton:hover{transform:translateY(-2px)}
  .boton.lleno{background:var(--rosa);color:#fff;border:2px solid var(--rosa)}
  .boton.lleno:hover{background:#f25aa6}
  .boton.vacio{background:rgba(11,19,32,.72);color:var(--texto);border:2px solid rgba(255,255,255,.45)}
  .boton.vacio:hover{border-color:#fff}
  /* subtítulos (vista previa sin voz; luego opcionales) */
  #subtitulo{position:absolute;left:180px;right:180px;bottom:44px;text-align:center;z-index:3;opacity:0;transition:opacity .25s;pointer-events:none}
  #subtitulo.on{opacity:1}
  #subtitulo span{display:inline;font:500 31px/1.45 var(--fuente);color:#fff;background:rgba(5,11,20,.78);padding:6px 16px;border-radius:8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  /* controles discretos: solo iconos, aparecen al mover el ratón */
  #controles{position:absolute;right:26px;bottom:30px;display:flex;gap:10px;z-index:6;opacity:0;transition:opacity .35s}
  body.raton #controles, body:not(.sonando) #controles{opacity:1}
  #controles button{width:58px;height:58px;border-radius:12px;border:1.5px solid var(--borde);background:var(--panel);color:var(--texto);cursor:pointer;display:grid;place-items:center;font:800 17px var(--fuente);letter-spacing:.04em}
  #controles button:hover{border-color:rgba(255,255,255,.5)}
  #controles button.activo{border-color:var(--rosa);color:var(--rosa)}
  #controles svg{width:24px;height:24px}
  #barra{position:absolute;left:0;right:0;bottom:0;height:18px;z-index:6;cursor:pointer;opacity:0;transition:opacity .35s}
  body.raton #barra, body:not(.sonando) #barra{opacity:1}
  #barra::before{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.14)}
  #barraTiempo{position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--rosa)}
  body:not(.sonando) #pausaIco{display:none} body.sonando #playIco{display:none}
  html.offline *{transition:none!important}
  html.auto #portada{visibility:hidden}
  html.offline #portada, html.offline #controles, html.offline #barra, html.offline #finalUI .boton{visibility:hidden}
  @media (prefers-reduced-motion: reduce){ #portada, .boton{transition:none} }
</style>
</head>
<body>
<div id="marco">
  <div id="escenario">
    <svg id="lienzo" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <image href="fondo.jpg" x="0" y="0" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>
      <rect id="velo" x="0" y="0" width="1920" height="1080" fill="#081628" opacity="0.55"/>
      <g id="capaEscenas"></g>
    </svg>
    <div id="portada"><button id="botonPlay" disabled title="Empezar"><svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z" fill="currentColor"/></svg></button></div>
    <div id="finalUI"><a class="boton vacio" id="salir" href="#">Salir</a><a class="boton lleno" id="irEjercicios" href="#">Ir a ejercicios</a></div>
    <div id="subtitulo"><span></span></div>
    <div id="controles">
      <button id="botonSubs" title="Subtítulos">CC</button>
      <button id="botonReinicio" title="Desde el principio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button>
      <button id="botonPausa" title="Pausa / seguir"><svg id="pausaIco" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><svg id="playIco" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg></button>
    </div>
    <div id="barra" title="Ir a un momento"><i id="barraTiempo"></i></div>
  </div>
</div>
<audio id="audio" preload="auto"></audio>
<script>window.INTRO_CFG = { salir: 'https://ge.lmathome.es/', ejercicios: 'https://teoria.ge.lmathome.es/?practice=ton_arm_tono' };</script>
<script src="bravura-datos.js"></script>
<script src="datos.js"></script>
<script src="tiempos.js" onerror="void 0"></script>
<script src="guion.js"></script>
<script src="notacion.js"></script>
<script src="dibujo.js"></script>
<script src="escenas.js"></script>
<script src="motor.js"></script>
</body>
</html>
